############################
# Application
############################
quarkus.application.name=groupys-backend
quarkus.http.root-path=/api
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

############################
# Security
############################
# JWT verification configuration for protected JAX-RS resources.
# Point the public key location at a PEM file, JWK set, or JWKS endpoint.
mp.jwt.verify.issuer=${JWT_ISSUER}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
# Allow 60s clock skew between client and server (Clerk tokens are only valid for 60s)
mp.jwt.token.clock-skew=60

############################
# CORS (dev-friendly)
############################
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,link
quarkus.http.cors.access-control-max-age=24H
# In prod, APP_CORS_ORIGINS must be set to the real frontend origin(s).
# StartupConfigValidator fails fast if the localhost dev default leaks into a prod boot.

############################
# HTTP Auth
############################
# WebSocket chat authenticates in-band with the first AUTH message.
quarkus.http.auth.permission.websocket.paths=/api/ws/*
quarkus.http.auth.permission.websocket.policy=permit

############################
# MinIO (quarkus-minio)
############################
# Disable Dev Services explicitly
quarkus.minio.devservices.enabled=false

# Connection
quarkus.minio.region=eu-central-1
quarkus.minio.host=localhost
quarkus.minio.port=9000
quarkus.minio.secure=false
# Credentials (use env vars!). Defaults align with docker-compose.yaml (MINIO_ROOT_USER/MINIO_ROOT_PASSWORD).
quarkus.minio.access-key=${MINIO_ACCESS_KEY:admin}
quarkus.minio.secret-key=${MINIO_SECRET_KEY:admin}

############################
# PostgreSQL
############################
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db
quarkus.datasource.username=${DB_USER:app}
quarkus.datasource.password=${DB_PASS:app}

# Connection pool settings - prevents connection exhaustion under load
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M
quarkus.datasource.jdbc.acquisition-timeout=5S

# Statement caching for better performance
quarkus.datasource.jdbc.preparation-cache.max-size=250

# Hibernate ORM
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=${HIBERNATE_SCHEMA_STRATEGY:validate}

quarkus.datasource.devservices.enabled=false
%dev.quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}
%test.quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# Flyway schema migrations.
# Inert until a V1 baseline exists AND FLYWAY_MIGRATE_AT_START=true is set.
# Dev/test still use Hibernate schema-management above; Flyway owns prod once enabled.
quarkus.flyway.locations=db/migration
quarkus.flyway.clean-disabled=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
%prod.quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:false}

############################
# Apple Music REST Client
############################
quarkus.rest-client.apple-music-api.url=https://api.music.apple.com
quarkus.rest-client.apple-music-api.scope=jakarta.inject.Singleton
quarkus.rest-client.apple-music-api.disable-default-mapper=true
# Prevent worker threads from hanging on an unresponsive Apple Music endpoint.
quarkus.rest-client.apple-music-api.connect-timeout=${APPLE_MUSIC_CONNECT_TIMEOUT_MS:10000}
quarkus.rest-client.apple-music-api.read-timeout=${APPLE_MUSIC_READ_TIMEOUT_MS:30000}

music.apple.team-id=${APPLE_TEAM_ID:}
music.apple.key-id=${APPLE_KEY_ID:}
music.apple.private-key=${APPLE_PRIVATE_KEY:}
music.apple.media-id=${APPLE_MEDIA_ID:}
music.apple.developer-token-ttl-seconds=${APPLE_DEVELOPER_TOKEN_TTL_SECONDS:300}

############################
# Expo Push Notifications
############################
quarkus.rest-client.expo-push-api.url=${EXPO_PUSH_API_URL:https://exp.host}
quarkus.rest-client.expo-push-api.scope=jakarta.inject.Singleton
quarkus.rest-client.expo-push-api.connect-timeout=${EXPO_PUSH_CONNECT_TIMEOUT_MS:5000}
quarkus.rest-client.expo-push-api.read-timeout=${EXPO_PUSH_READ_TIMEOUT_MS:15000}

############################
# Redis
############################
quarkus.redis.default.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=2S

############################
# Performance feature flags
############################
performance.redis.enabled=${PERF_REDIS_ENABLED:false}
performance.redis.recommendation.read-enabled=${PERF_REDIS_RECO_READ_ENABLED:false}
performance.redis.recommendation.write-enabled=${PERF_REDIS_RECO_WRITE_ENABLED:false}
performance.redis.recommendation.legacy-postgres-write-enabled=${PERF_REDIS_RECO_LEGACY_WRITE_ENABLED:true}
performance.redis.chat-rate-limit-enabled=${PERF_REDIS_CHAT_RATE_LIMIT_ENABLED:false}
performance.redis.unread-counters-enabled=${PERF_REDIS_UNREAD_ENABLED:false}
performance.redis.readiness.strict-enabled=${PERF_REDIS_READINESS_STRICT_ENABLED:false}

performance.schema.bootstrap-enabled=${PERF_SCHEMA_BOOTSTRAP_ENABLED:true}
performance.vector.bootstrap-enabled=${PERF_VECTOR_BOOTSTRAP_ENABLED:true}
performance.vector.read-enabled=${PERF_VECTOR_READ_ENABLED:false}
performance.vector.candidate-top-k=${PERF_VECTOR_TOP_K:500}
performance.vector.embedding-dimension=${PERF_VECTOR_DIMENSION:768}

performance.snapshot.blob.read-enabled=${PERF_SNAPSHOT_BLOB_READ_ENABLED:false}
performance.snapshot.blob.write-enabled=${PERF_SNAPSHOT_BLOB_WRITE_ENABLED:false}
performance.snapshot.payload-json-write-enabled=${PERF_SNAPSHOT_JSON_WRITE_ENABLED:true}
performance.snapshot.bucket=${PERF_SNAPSHOT_BUCKET:music-snapshots}

performance.read-model.read-enabled=${PERFAD_MODEL_READ_ENABLED:false}
performance.read-model.write-enabled=${PERF_READ_MODEL_WRITE_ENABLED:false}

# Hot takes admin
groupys.admin.secret=${GROUPYS_ADMIN_SECRET:}

############################
# Encryption
############################
# Base64-encoded 256-bit AES key for token encryption
# Generate with: openssl rand -base64 32
# Development fallback key - DO NOT USE IN PRODUCTION
encryption.master.key=${ENCRYPTION_MASTER_KEY:3g4FPNNv7HSfuESqdT8JJl/ztsxAGMEkNc9XemaarG0=}

# Feed cache (Caffeine)
quarkus.cache.caffeine.feed.expire-after-write=60S
quarkus.cache.caffeine.feed.maximum-size=10000

############################
# HTTP Performance
############################
# Enable response compression
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json

############################
# HTTP Thread Pool
############################
quarkus.http.io-threads=20

############################
# Dev/Production Profiles
############################
# Production optimizations
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.level=INFO
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.http.access-log.enabled=true
