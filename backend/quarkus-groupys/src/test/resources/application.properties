# Test-only configuration.
#
# @QuarkusTest boots the full application, which requires a complete config.
# Previously these values were only ever supplied by a developer's local .env
# (gitignored), so the tests passed locally but failed in CI where no .env
# exists. Pin deterministic dummy values here so the test boot is hermetic and
# independent of the host environment. None of these reach a real external
# service during tests.

# JWT verification — tests never verify a real token, so any non-empty issuer
# and an in-classpath public key are enough to satisfy startup config validation.
mp.jwt.verify.issuer=https://test.groupys.local
mp.jwt.verify.publickey.location=jwt/test-public-key.pem

# Admin endpoints
groupys.admin.secret=test-admin-secret

# Apple Music credentials — never used to sign a real developer token in tests.
music.apple.team-id=TESTTEAMID0
music.apple.key-id=TESTKEYID00
music.apple.private-key=test-private-key
music.apple.media-id=TESTMEDIAID
