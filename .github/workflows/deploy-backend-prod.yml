name: Deploy Backend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "25"
  API_IMAGE_NAME: groupys-api

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/quarkus-groupys/**'
            deploy:
              - 'docker/docker-compose.api.prod.yaml'
              - '.github/workflows/deploy-backend-prod.yml'

  build:
    needs: changes
    # Build whenever the backend changed, the deploy assets (compose/workflow)
    # changed, or on manual dispatch — so a fresh image (incl. :latest) always
    # exists before the deploy job pulls it. Avoids "manifest unknown" on
    # config-only pushes that fall back to the :latest tag.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # @QuarkusTest boots the full app with datasource dev services disabled, so
    # it needs a real Postgres at localhost:5432 (db/app/app) — same as the local
    # docker compose dev stack. Redis is provided by Quarkus dev services.
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: db
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify
        working-directory: backend/quarkus-groupys

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./backend/quarkus-groupys
          file: ./backend/quarkus-groupys/src/main/docker/Dockerfile.jvm
          push: true
          cache-from: type=gha,scope=groupys-api
          cache-to: type=gha,mode=max,ignore-error=true,scope=groupys-api
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.API_IMAGE_NAME }}:latest

      - name: Build summary
        run: |
          {
            echo "## Backend Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Status** | ✅ Success |"
            echo "| **Triggered by** | \`${{ github.actor }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Java version** | ${{ env.JAVA_VERSION }} |"
            echo "| **Image (sha tag)** | \`ghcr.io/${OWNER_LC}/${API_IMAGE_NAME}:${GITHUB_SHA}\` |"
            echo "| **Image (latest tag)** | \`ghcr.io/${OWNER_LC}/${API_IMAGE_NAME}:latest\` |"
            echo "| **Digest** | \`${{ steps.docker_build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-24.04
    if: always() && !failure() && !cancelled()
    needs:
      - changes
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Resolve image tag
        id: tags
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare remote deploy directory
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VM88_HOST }}
          username: ${{ secrets.VM88_USER }}
          key: ${{ secrets.VM88_SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH/docker"

      - name: Upload production compose assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM88_HOST }}
          username: ${{ secrets.VM88_USER }}
          key: ${{ secrets.VM88_SSH_PRIVATE_KEY }}
          source: docker/docker-compose.api.prod.yaml
          target: ${{ secrets.DEPLOY_PATH }}/docker
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ghcr.io/${{ env.OWNER_LC }}/${{ env.API_IMAGE_NAME }}:${{ steps.tags.outputs.api_tag }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_PUBLIC_KEY_LOCATION: ${{ secrets.JWT_PUBLIC_KEY_LOCATION }}
          APP_CORS_ORIGINS: ${{ secrets.APP_CORS_ORIGINS }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_MEDIA_ID: ${{ secrets.APPLE_MEDIA_ID }}
          GROUPYS_ADMIN_SECRET: ${{ secrets.GROUPYS_ADMIN_SECRET }}
        with:
          host: ${{ secrets.VM88_HOST }}
          username: ${{ secrets.VM88_USER }}
          key: ${{ secrets.VM88_SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,REGISTRY_USERNAME,REGISTRY_PASSWORD,API_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,JWT_ISSUER,JWT_PUBLIC_KEY_LOCATION,APP_CORS_ORIGINS,ENCRYPTION_MASTER_KEY,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_MEDIA_ID,GROUPYS_ADMIN_SECRET
          script: |
            set -eu

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is required on the server."
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH/docker"

            # docker compose --env-file has no multi-line support, so the Apple
            # .p8 PEM (real newlines) must be collapsed to a single line with
            # literal \n escapes. The API decodes \n back to newlines on startup.
            APPLE_PRIVATE_KEY_ONELINE=$(printf '%s' "$APPLE_PRIVATE_KEY" | awk 'BEGIN{ORS=""} {gsub(/\r/,"")} NR>1{printf "\\n"} {printf "%s",$0}')

            # Backend-only env file. The web stack maintains its own .env.prod;
            # this deploy only acts on the API + its datastores, so missing web
            # variables surface as harmless interpolation warnings.
            cat > "$DEPLOY_PATH/docker/.env.api.prod" <<EOF
            API_IMAGE=$API_IMAGE
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=${POSTGRES_DB:-db}
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            JWT_ISSUER=$JWT_ISSUER
            JWT_PUBLIC_KEY_LOCATION=$JWT_PUBLIC_KEY_LOCATION
            APP_CORS_ORIGINS=$APP_CORS_ORIGINS
            ENCRYPTION_MASTER_KEY=$ENCRYPTION_MASTER_KEY
            APPLE_TEAM_ID=$APPLE_TEAM_ID
            APPLE_KEY_ID=$APPLE_KEY_ID
            APPLE_PRIVATE_KEY=$APPLE_PRIVATE_KEY_ONELINE
            APPLE_MEDIA_ID=$APPLE_MEDIA_ID
            GROUPYS_ADMIN_SECRET=$GROUPYS_ADMIN_SECRET
            EOF

            COMPOSE="docker compose --env-file $DEPLOY_PATH/docker/.env.api.prod -f $DEPLOY_PATH/docker/docker-compose.api.prod.yaml"

            # MinIO FATAL-exits within ~1s if the root password is shorter than
            # 8 chars or the user shorter than 3, which then cascades as
            # "dependency groupys-minio is unhealthy" with no obvious cause.
            # Catch a misconfigured secret here with a clear message instead.
            if [ "${#MINIO_ROOT_USER}" -lt 3 ] || [ "${#MINIO_ROOT_PASSWORD}" -lt 8 ]; then
              echo "ERROR: MINIO_ROOT_USER must be >= 3 chars and MINIO_ROOT_PASSWORD >= 8 chars."
              echo "       Fix the GitHub repository secrets and re-run."
              exit 1
            fi

            # Dump the full stack state + per-container logs on any failure so a
            # crashing dependency (e.g. minio) is diagnosable from the CI log
            # rather than just "dependency failed to start".
            dump_diagnostics() {
              echo "===== docker compose ps ====="
              $COMPOSE ps -a || true
              for svc in groupys-db groupys-minio groupys-redis groupys-api; do
                echo "===== logs: $svc ====="
                docker logs --tail=120 "$svc" 2>&1 || true
              done
            }

            wait_for_api() {
              attempts="${1:-45}"
              for i in $(seq 1 "$attempts"); do
                if docker exec groupys-api sh -lc "curl -fsS http://127.0.0.1:8080/api/q/health/ready >/dev/null 2>&1"; then
                  echo "Backend healthy at /api/q/health/ready"
                  return 0
                fi
                echo "Waiting for API startup... ($i/$attempts)"
                sleep 2
              done
              return 1
            }

            backup_database() {
              if ! docker inspect groupys-db >/dev/null 2>&1; then
                echo "No existing database container; skipping pre-deploy backup."
                return 0
              fi

              backup_dir="$DEPLOY_PATH/backups/postgres"
              backup_file="$backup_dir/db-$(date -u +%Y%m%dT%H%M%SZ).dump"
              backup_tmp="$backup_file.tmp"
              mkdir -p "$backup_dir"

              echo "Creating pre-deploy database backup: $backup_file"
              if docker exec groupys-db sh -lc 'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup_tmp" &&
                [ -s "$backup_tmp" ] &&
                docker exec -i groupys-db sh -lc 'exec pg_restore --list' < "$backup_tmp" >/dev/null; then
                mv "$backup_tmp" "$backup_file"
              else
                rm -f "$backup_tmp"
                echo "Database backup failed; refusing to deploy."
                return 1
              fi

              find "$backup_dir" -type f -name 'db-*.dump' -mtime +14 -delete
            }

            rollback_api() {
              if [ -z "$PREVIOUS_API_IMAGE_ID" ]; then
                echo "No previous API image is available for rollback."
                return 1
              fi

              echo "Rolling API back to $PREVIOUS_API_IMAGE ($PREVIOUS_API_IMAGE_ID)"
              if ! env API_IMAGE="$ROLLBACK_API_IMAGE" $COMPOSE up -d --no-deps --pull never groupys-api; then
                echo "Rollback compose operation failed."
                return 1
              fi

              if wait_for_api 45; then
                sed -i "s|^API_IMAGE=.*|API_IMAGE=$ROLLBACK_API_IMAGE|" "$DEPLOY_PATH/docker/.env.api.prod"
                echo "Rollback completed; production API is healthy."
                return 0
              fi

              echo "Rollback image did not become healthy."
              return 1
            }

            PREVIOUS_API_IMAGE=$(docker inspect -f '{{.Config.Image}}' groupys-api 2>/dev/null || true)
            PREVIOUS_API_IMAGE_ID=$(docker inspect -f '{{.Image}}' groupys-api 2>/dev/null || true)
            ROLLBACK_API_IMAGE=groupys-api:rollback
            if [ -n "$PREVIOUS_API_IMAGE_ID" ]; then
              docker image tag "$PREVIOUS_API_IMAGE_ID" "$ROLLBACK_API_IMAGE"
            fi

            echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
            backup_database
            $COMPOSE pull groupys-api
            if ! $COMPOSE up -d groupys-db groupys-minio groupys-redis groupys-api; then
              echo "Compose failed to bring the stack up."
              dump_diagnostics
              rollback_api || true
              exit 1
            fi

            if wait_for_api 45; then
              exit 0
            fi

            echo "API did not become healthy"
            dump_diagnostics
            rollback_api || true
            exit 1

      - name: Deploy summary
        run: |
          {
            echo "## Backend Deploy Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Host** | ${{ secrets.VM88_HOST }} |"
            echo "| **Image** | \`ghcr.io/${{ env.OWNER_LC }}/${{ env.API_IMAGE_NAME }}:${{ steps.tags.outputs.api_tag }}\` |"
            echo "| **Deploy path** | ${{ secrets.DEPLOY_PATH }} |"
          } >> "$GITHUB_STEP_SUMMARY"
